[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learning_hit_to_lead"
version = "0.1.0"
description = "Reproducible chemical-series adaptation and compound acquisition benchmarks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "pandas>=2.2", "torch>=2.4", "matplotlib>=3.8"]

[project.optional-dependencies]
chemistry = ["rdkit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
